name: SonarCloud Scan

# Shared by pr-checks-develop.yml (pull requests into develop) and sonar-develop.yml (pushes to develop).
# A pull request scan only produces a PR analysis; the develop branch's own analysis, which the
# quality gate check in pr-checks-main.yml reads, is only refreshed by a scan of a push to develop.

on:
  workflow_call:

jobs:
  sonarcloud-scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache SonarCloud packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -Path ${{ runner.temp }}/scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}/scanner

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Run JS tests with coverage
        run: npm test

      - name: Normalize lcov paths
        shell: pwsh
        run: |
          $lcov = "coverage/lcov.info"
          (Get-Content $lcov) -replace '\\', '/' -replace 'SF:src/TwBlazor/', 'SF:' | Set-Content $lcov

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          chmod +x ${{ runner.temp }}/scanner/dotnet-sonarscanner
          ${{ runner.temp }}/scanner/dotnet-sonarscanner begin `
            /k:"twblazor_twblazor" `
            /o:"twblazor" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.exclusions="docs/TwBlazor.Docs/Examples/**,**/*.css,**/*.woff,**/*.woff2,**/*.ttf,**/*.eot,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico" `
            /d:sonar.cpd.exclusions="**/wwwroot/404.html" `
            /d:sonar.javascript.lcov.reportPaths="${{ github.workspace }}/coverage/lcov.info" `
            /d:sonar.coverage.exclusions="docs/TwBlazor.Docs/**,docs/TwBlazor.Server/**,docs/TwBlazor.WASM/**,docs/TwBlazor.WasmHost/**,build/TwBlazor.BuildTools/**,src/TwBlazor.Theme/**,build/TwBlazor.Docs.Compiler/**,**/Program.cs,src/TwBlazor/Components/ColorPicker/TwColorPicker.razor,src/TwBlazor/Components/TimePicker/TwTimePicker.razor" `
            /d:sonar.cs.opencover.reportsPaths="${{ github.workspace }}/coverage/**/coverage.opencover*.xml"
          dotnet build --configuration Release
          dotnet test tests/TwBlazor.Tests/TwBlazor.Tests.csproj --no-build --configuration Release --results-directory "${{ github.workspace }}/coverage" -- --coverlet --coverlet-output-format opencover
          dotnet test tests/TwBlazor.Docs.Tests/TwBlazor.Docs.Tests.csproj --no-build --configuration Release --results-directory "${{ github.workspace }}/coverage/docs-tests" -- --coverlet --coverlet-output-format opencover
          ${{ runner.temp }}/scanner/dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
