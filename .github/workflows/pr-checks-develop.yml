name: PR Checks (develop)

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  header-check:
    name: Header Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate copyright headers
        shell: pwsh
        run: ./scripts/validate-headers.ps1

  build-and-test:
    name: Build and Test (PR to develop)
    uses: ./.github/workflows/build-and-test.yml
    permissions:
      checks: write
      contents: read
      actions: read
    with:
      configuration: Release

  sonarcloud-scan:
    name: SonarCloud Scan
    # Dependabot-triggered runs read secrets from the Dependabot store, where SONAR_TOKEN is not set.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    uses: ./.github/workflows/sonar-scan.yml
    secrets: inherit
    permissions:
      contents: read

  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0  # Full history required for MinVer

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Vulnerability scan
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(dotnet list package --vulnerable --include-transitive || true)"
          echo "$OUTPUT"
          if [ -z "${OUTPUT//[[:space:]]/}" ]; then
            echo "No output from dotnet list package assuming no vulnerable packages."
            exit 0
          fi
          if echo "$OUTPUT" | grep -qi -e "no vulnerable packages" -e "No vulnerable packages were found."; then
            echo "No vulnerable packages found."
            exit 0
          fi
          echo "::error ::Vulnerable packages detected in dependencies. See output above."
          exit 1
