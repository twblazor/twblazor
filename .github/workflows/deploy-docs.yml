name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and Test (docs deploy gate)
    uses: ./.github/workflows/build-and-test.yml
    with:
      configuration: Release

  publish-docs:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # The library targets .NET 10 and .NET 11, so both are installed.
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Copy README to index
        run: |
          cp README.md index.md

      - name: Install DocFX
        run: dotnet tool update -g docfx

      - name: Build Documentation
        run: docfx docfx.json

      - name: Restrict indexing to the landing page
        shell: bash
        run: |
          set -euo pipefail
          # Only the landing page should appear in search results; the ~150
          # generated API pages are thin, near-duplicate content that competes
          # with twblazor.com for the same terms.
          #
          # A meta tag rather than robots.txt, for two reasons. This is a GitHub
          # Pages *project* site served from a sub-path
          # (twblazor.github.io/twblazor/), and crawlers only read robots.txt at
          # the host root - a robots.txt shipped here would never be fetched.
          # Disallow would also be the wrong tool even if it were: it blocks
          # crawling, not indexing, and a blocked URL can still be listed
          # without a snippet. Add a CNAME later and this still works unchanged.
          #
          # "follow" so the links out to twblazor.com are still credited.
          count=0
          while IFS= read -r -d '' f; do
            [ "$f" = "_site/index.html" ] && continue
            sed -i 's|<head>|<head>\n    <meta name="robots" content="noindex, follow">|' "$f"
            count=$((count + 1))
          done < <(find _site -name '*.html' -print0)
          echo "Marked $count pages noindex; _site/index.html stays indexable."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4