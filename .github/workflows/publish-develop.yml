name: Publish Develop Package

# Publishes a prerelease of develop on every push. The version is derived by
# MinVer from the newest release tag plus the number of commits since it, so it
# increments on its own and nothing here writes back to the repository:
#
#   tag v1.1.0, 3 commits later -> 1.1.1-preview.3
#   one more commit             -> 1.1.1-preview.4

on:
  push:
    branches:
      - develop

jobs:
  publish-prerelease:
    name: Build and Publish Prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0    # MinVer needs full history to measure commit height
          fetch-tags: true  # ...and every release tag to find the base version

      - name: Compute preview version
        id: version
        shell: pwsh
        run: ./scripts/next-preview-version.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build src/TwBlazor/TwBlazor.csproj --configuration Release --no-restore -p:MinVerVersionOverride=${{ steps.version.outputs.version }}

      - name: Pack
        run: |
          dotnet pack src/TwBlazor/TwBlazor.csproj \
            --configuration Release \
            --no-build \
            -p:MinVerVersionOverride=${{ steps.version.outputs.version }} \
            --output ./artifacts

      - name: Verify packed version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ls -1 ./artifacts
          # Assert the exact version, not merely "some prerelease". If the
          # override fails to reach build or pack, MinVer falls back to the
          # newest *reachable* tag, which on develop is the previous release -
          # that still looks like a prerelease while sorting below what has
          # already shipped, so a looser check would wave it through.
          if [ ! -f "./artifacts/twblazor.$VERSION.nupkg" ]; then
            echo "::error::Expected ./artifacts/twblazor.$VERSION.nupkg. Check that -p:MinVerVersionOverride reached both the build and pack steps."
            exit 1
          fi
          case "$VERSION" in
            *-preview.*) echo "Packed twblazor $VERSION" ;;
            *) echo "::error::develop computed a stable version ($VERSION); develop must only ever publish previews."; exit 1 ;;
          esac

      - name: Publish to GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source "https://nuget.pkg.github.com/TwBlazor/index.json" \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
