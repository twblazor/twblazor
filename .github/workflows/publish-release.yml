name: Publish Release Package

# Cuts a stable release of main. The version is decided by the release:major /
# release:minor / release:patch label on the pull request that was merged
# (enforced before merge by pr-release-label.yml), turned into a Git tag here.
# That tag is the only record of the version: MinVer reads it at build time, so
# nothing in the repository needs to be edited or committed in order to
# release. release:none skips the release job entirely.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump for this release'
        type: choice
        options:
          - major
          - minor
          - patch
        default: minor

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  determine-bump:
    name: Determine Version Bump
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read   # read the merged PR's release: label
    outputs:
      skip: ${{ steps.bump.outputs.skip }}
      bump: ${{ steps.bump.outputs.bump }}

    steps:
      - name: Determine version bump
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch requested a '$INPUT_BUMP' bump."
            echo "bump=$INPUT_BUMP" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LABELS="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[].labels[].name' || true)"
          echo "Labels on the pull request for $SHA: ${LABELS:-(none)}"

          # release:none is checked before the bump labels and short-circuits: a
          # PR merged with it never reaches the release job at all, so an
          # unwanted release shows as a clean skip rather than a failure.
          if echo "$LABELS" | grep -qx 'release:none'; then
            echo "The merged pull request is labelled 'release:none'; skipping the release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Matched generically and required to be unique. pr-release-label.yml
          # already blocks a PR carrying two bump labels, but this runs after the
          # merge and must not silently pick one if that gate was bypassed.
          BUMPS="$(echo "$LABELS" | grep -E '^release:(major|minor|patch)$' | sort -u | xargs || true)"
          COUNT="$(echo "$BUMPS" | wc -w)"

          if [ "$COUNT" -eq 1 ]; then
            echo "bump=${BUMPS#release:}" >> "$GITHUB_OUTPUT"
          elif [ "$COUNT" -gt 1 ]; then
            echo "::error::The pull request for $SHA carries more than one release bump label ($BUMPS), so the version is ambiguous and nothing was published."
            exit 1
          else
            echo "::error::No release:major, release:minor or release:patch label found on the pull request for $SHA, so nothing was published. To release this commit, run this workflow manually (Actions -> Publish Release Package -> Run workflow) and choose a bump."
            exit 1
          fi

  release:
    name: Tag, Build and Publish Release
    needs: determine-bump
    if: needs.determine-bump.outputs.skip != 'true'
    runs-on: ubuntu-latest

    # The app credentials live on this environment, not on the repository, and
    # the environment is restricted to the main branch.
    environment: release

    permissions:
      contents: write       # push the release tag, create the GitHub Release
      packages: write       # push the NuGet package
      id-token: write       # OIDC trusted publishing to NuGet.org
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      # GITHUB_TOKEN is subject to branch protection like any other actor, so it
      # cannot push the README commit below to a protected main. This app is on
      # the ruleset's bypass list; see CONTRIBUTING for the repository setup.
      # The tag push further down rides on the same credentials.
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0    # MinVer needs full history to measure commit height
          fetch-tags: true  # ...and every release tag to find the base version

      - name: Compute release version
        id: version
        shell: pwsh
        run: |
          # Re-running the workflow on an already-released commit must not cut a
          # second version, so reuse the tag when HEAD already carries one.
          $existing = @(git tag --list --points-at HEAD | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' })
          if ($existing.Count -gt 0) {
              $tag = $existing[0]
              Write-Host "HEAD is already tagged $tag; reusing that version."
              "version=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              "tag=$tag"                     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
              ./scripts/next-release-version.ps1 -Bump '${{ needs.determine-bump.outputs.bump }}'
          }

      # Deliberately ahead of the tag: the README commit has to be part of what
      # gets tagged, or HEAD would no longer carry the tag and the re-run guard
      # in "Compute release version" above would cut a second release. Pushing
      # before anything is tagged or published also means a rejected push (main
      # moved underneath us) fails the job with nothing half-released.
      - name: Point README install command at this release
        id: readme
        shell: pwsh
        run: ./scripts/update-readme-version.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Point Get Started docs install commands at this release
        id: getstarted
        shell: pwsh
        run: ./scripts/update-readme-version.ps1 -Path docs/TwBlazor.Docs/Pages/GetStarted.razor -Version '${{ steps.version.outputs.version }}'

      # This is the README shown on the NuGet.org package page (packed as
      # README.md by TwBlazor.csproj), separate from the repository README.md.
      - name: Point NuGet package readme install command at this release
        id: pkgreadme
        shell: pwsh
        run: ./scripts/update-readme-version.ps1 -Path src/TwBlazor/PackageReadme.md -Version '${{ steps.version.outputs.version }}'

      - name: Commit docs version bump
        if: steps.readme.outputs.changed == 'true' || steps.getstarted.outputs.changed == 'true' || steps.pkgreadme.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Committed through the API rather than `git push` so that main can
          # keep "Require signed commits": GitHub signs commits it creates
          # itself, and the same commit made over git with an app token is
          # unsigned. Authorship comes from the token, so this needs no
          # git config identity.
          #
          # [skip ci] because an app token's writes DO start new workflow runs,
          # unlike GITHUB_TOKEN's. Without it this re-triggers this workflow on
          # a commit with no pull request behind it, so "Determine version
          # bump" would fail and redden every release.
          additions="[]"
          add_file() {
            local path="$1"
            additions="$(jq -c --arg path "$path" --arg content "$(base64 -w0 "$path")" \
              '. + [{path: $path, contents: $content}]' <<<"$additions")"
          }

          [ "${{ steps.readme.outputs.changed }}" = "true" ] && add_file "README.md"
          [ "${{ steps.getstarted.outputs.changed }}" = "true" ] && add_file "docs/TwBlazor.Docs/Pages/GetStarted.razor"
          [ "${{ steps.pkgreadme.outputs.changed }}" = "true" ] && add_file "src/TwBlazor/PackageReadme.md"

          HEAD_OID="$(git rev-parse HEAD)"
          QUERY='mutation($repo:String!,$branch:String!,$oid:GitObjectID!,$message:String!,$additions:[FileAddition!]!){
            createCommitOnBranch(input:{
              branch:{repositoryNameWithOwner:$repo,branchName:$branch}
              expectedHeadOid:$oid
              message:{headline:$message}
              fileChanges:{additions:$additions}
            }){commit{oid}}
          }'
          PAYLOAD="$(jq -n \
            --arg query "$QUERY" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg oid "$HEAD_OID" \
            --arg message "docs: point install command at $VERSION [skip ci]" \
            --argjson additions "$additions" \
            '{query:$query, variables:{repo:$repo,branch:$branch,oid:$oid,message:$message,additions:$additions}}')"

          NEW="$(echo "$PAYLOAD" | gh api graphql --input - --jq .data.createCommitOnBranch.commit.oid)"
          echo "Created signed commit $NEW on $BRANCH."

          # That commit only exists on the server, so HEAD is still the merge
          # commit. The tag below has to land on the new commit, and MinVer
          # only considers tags reachable from HEAD, so move the checkout onto
          # it - otherwise the tag and the packed version disagree.
          # Fetch the branch (fetching a bare SHA needs a server-side option we
          # should not rely on), then reset to the exact commit we just made
          # rather than to FETCH_HEAD, so a concurrent push cannot slip in.
          git fetch origin "$BRANCH"
          git reset --hard "$NEW"

      - name: Create release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # The tag has to exist locally before the build, because that is where
          # MinVer reads the version from.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
          fi
          git push origin "refs/tags/$TAG"

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build src/TwBlazor/TwBlazor.csproj --configuration Release --no-restore

      - name: Pack
        run: |
          dotnet pack src/TwBlazor/TwBlazor.csproj \
            --configuration Release \
            --no-build \
            --output ./artifacts

      - name: Verify packed version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "./artifacts/twblazor.$VERSION.nupkg" ]; then
            echo "::error::Expected ./artifacts/twblazor.$VERSION.nupkg but MinVer produced something else:"
            ls -1 ./artifacts
            exit 1
          fi
          echo "Packed twblazor $VERSION"

      - name: Publish to GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source "https://nuget.pkg.github.com/TwBlazor/index.json" \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: NuGet login (OIDC → temp API key)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_ORG_USERNAME }}

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg             --source "https://api.nuget.org/v3/index.json"             --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"             --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists."
          else
            # --generate-notes takes no formatting options, so call the same API
            # it calls and edit the result: GitHub writes each entry as
            # "<title> by @user in <url>", and we want it without the "by".
            # Anchored on the trailing " in " so a "by" inside a PR title is
            # left alone.
            NOTES="$(gh api "repos/$REPO/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body |
              sed -E 's/ by (@[A-Za-z0-9-]+ in )/ \1/g')"
            gh release create "$TAG" --title "$TAG" --notes "$NOTES" ./artifacts/*.nupkg
          fi

      - name: Back-merge into develop
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # The release leaves main ahead by the README commit, and develop is
          # the default branch - the one the repository page renders - so
          # without this it falls a version behind on every release, and the
          # two histories drift further apart each time.
          #
          # develop is an ancestor of main immediately after a release merge, so
          # this is a fast-forward; force stays false so it can never rewrite
          # develop. If somebody merged into develop while the release ran it is
          # no longer an ancestor and GitHub refuses the update - that is not a
          # release failure, so it warns instead of exiting non-zero, and the
          # next release catches up.
          SHA="$(git rev-parse HEAD)"
          if OUT="$(gh api -X PATCH "repos/$REPO/git/refs/heads/develop" \
                      -F sha="$SHA" -F force=false 2>&1)"; then
            echo "Fast-forwarded develop to $SHA."
          else
            echo "$OUT"
            echo "::warning::Could not fast-forward develop to $SHA; it has likely moved on since this release started. Merge main into develop by hand."
          fi
