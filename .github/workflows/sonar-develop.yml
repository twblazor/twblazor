name: Sonar Analysis (develop)

# Refreshes the develop branch analysis on SonarCloud after every merge. pr-checks-develop.yml only
# scans pull requests, which never updates the develop branch's own analysis or quality gate.

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  sonarcloud-scan:
    name: SonarCloud Scan
    uses: ./.github/workflows/sonar-scan.yml
    secrets: inherit
    permissions:
      contents: read
